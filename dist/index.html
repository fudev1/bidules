<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:176px;height:176px;user-select:none;-webkit-user-select:none}
body:not(.pret){visibility:hidden}          /* rien ne s'affiche avant que le Bidule choisi soit chargé */
img{position:absolute;left:24px;bottom:0;width:128px;height:128px;image-rendering:pixelated;display:block;cursor:grab;-webkit-user-drag:none;transform-origin:50% 60%}
img.walk{animation:bob .5s steps(2) infinite}
img.hop{animation:hop .45s ease-out}
img.land{animation:land .3s ease-out}
img.wall{animation:wall .25s ease-out}
img.struggle{transform-origin:50% 8%;animation:struggle .22s ease-in-out infinite}
@keyframes bob{50%{translate:0 -3px}}
@keyframes hop{40%{translate:0 -22px}}
@keyframes land{35%{scale:calc(var(--sx) * 1.18) .78;translate:0 6px}70%{scale:calc(var(--sx) * .94) 1.08}}
@keyframes wall{40%{scale:calc(var(--sx) * .8) 1.12}}
@keyframes struggle{0%,100%{rotate:-11deg}50%{rotate:11deg}}
img.giggle{animation:giggle .12s linear infinite}
@keyframes giggle{0%,100%{rotate:-4deg}50%{rotate:4deg}}
img.shake{animation:shake .08s linear infinite}
@keyframes shake{0%,100%{translate:-2px 0}50%{translate:2px 0}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#el{position:absolute;left:0;top:0;width:352px;height:420px;image-rendering:pixelated;pointer-events:none}
img.recoil{transform-origin:50% 100%;animation:recoil .5s ease-out}
@keyframes recoil{20%{scale:calc(var(--sx) * .82) 1.3}45%{scale:calc(var(--sx) * 1.18) .84}70%{scale:calc(var(--sx) * .95) 1.07}}
body[data-mood="guilleret"] img.walk{animation:bobHappy .36s ease-in-out infinite}
@keyframes bobHappy{50%{translate:0 -7px}}
body[data-mood="ronchon"] img.walk{animation:bobHeavy .9s steps(2) infinite}
@keyframes bobHeavy{50%{translate:0 -1px}}
body[data-mood="vaseux"] img.walk{animation:swayTired 2.2s ease-in-out infinite}
@keyframes swayTired{0%,100%{rotate:-5deg}50%{rotate:5deg}}
body[data-mood="stresse"] img.walk{animation:jitter .09s linear infinite}
@keyframes jitter{0%,100%{translate:-1px 0}50%{translate:1px -1px}}
body[data-mood="lune"] img.walk{animation:floaty 2.4s ease-in-out infinite}
@keyframes floaty{50%{translate:0 -6px}}
body.sheet img.walk,body.sheet[data-mood] img.walk{animation:none}
img.woozy{animation:woozy 1s ease-in-out infinite}
@keyframes woozy{0%,100%{rotate:-9deg}50%{rotate:9deg}}
img.breathe{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{scale:var(--sx) .94;translate:0 4px}}
img.dangle{transform-origin:50% 8%;animation:dangle 2s ease-in-out infinite}
@keyframes dangle{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.zz{position:absolute;left:112px;top:84px;font:800 16px -apple-system,system-ui,sans-serif;color:#2a2238;text-shadow:0 0 2px #fff,0 0 3px #fff}
.drop{position:absolute;width:6px;height:6px;background:#4aa8e0;border:1px solid #2a2238}
.heart{position:absolute;top:86px;width:21px;height:18px;image-rendering:pixelated}
.pense{position:absolute;left:66px;top:50px;width:56px;height:36px;image-rendering:pixelated;transform-origin:90% 100%;transition:opacity .25s,scale .25s}
.pense.off{opacity:0;scale:.6}
.bub{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#fff;color:#2a2238;border:2px solid #2a2238;border-radius:8px;padding:2px 7px;font:700 13px -apple-system,system-ui,sans-serif;white-space:nowrap}
.defi{position:absolute;left:4px;right:4px;top:4px;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;background:#fff;color:#2a2238;border:2px solid #2a2238;border-radius:8px;padding:4px 5px;font:700 12px -apple-system,system-ui,sans-serif;text-align:center}
.defi b{flex-basis:100%}
.defi button{font:700 11px -apple-system,system-ui,sans-serif;border:2px solid #2a2238;border-radius:6px;background:#ffd84a;color:#2a2238;padding:2px 6px;cursor:pointer}
.defi button+button{background:#fff}
</style></head>
<body><img id="b" alt=""><canvas id="el" width="176" height="210" hidden></canvas><div id="fx"></div>
<script src="bidule64.js"></script>
<script src="pense.js"></script>
<script src="monstre64.js"></script>
<script src="js/horloge.js"></script>
<script src="js/fenetre.js"></script>
<script src="js/icone.js"></script>
<script src="js/feuilles.js"></script>
<script src="js/etirement.js"></script>
<script src="js/animation.js"></script>
<script src="js/corps.js"></script>
<script src="js/cheveux.js"></script>
<script src="js/vie.js"></script>
<script src="js/tenu.js"></script>
<script src="js/souris.js"></script>
<script src="js/claude.js"></script>
<script src="js/duel-defi.js"></script>
<script src="js/demarrage.js"></script></body></html>
