function struggle(on) {

function clicked() {

img.addEventListener("pointerdown", e => {

img.addEventListener("pointermove", e => {

img.addEventListener("pointerup", async () => {
  if (!drag) return;
  const {moved, shaken, asleep} = drag; drag = null; img.style.cursor = "grab"; struggle(false);

  const old = samples.find(s => now - s.t < 90) || last, dt = Math.max(16, last.t - old.t);

  if (fromPull) await pullFinish();
  if (!moved) { clicked(); return; }
  vx = tvx; vy = tvy;
  nausea = shaken;
  await bounds();
  if (asleep) { bubble("Hein ?!", 900); say(Math.hypot(vx, vy) > 10 ? "reveille : lance" : "reveille : repose au sol"); calm = 0; wake = 0; }     // attrapé endormi, il ne se rendort pas : il retombe réveillé
  disturb();

  if (!isSheet()) img.src = FR.p1; pose(""); mode = "fly"; bounces = 0; maxImpact = 0; crashed = false;
  if (isSheet()) sheetAnim(Date.now());

});
function stopWatch() { watching = false; lookKey = ""; if (mode === "walk" && !isSheet()) img.src = FR.normal; }
async function watchCursor() {
  if (drag || !(mode === "walk" || mode === "pet" || mode === "sleep")) { if (watching) stopWatch(); pet.last = null; return; }
  let c;
  try { c = await T.window.cursorPosition(); } catch (e) { say("cursorPosition: " + e); clearInterval(watchT); return; }
  const cx = c.x / scale, cy = c.y / scale; cursor = {x:cx, y:cy};
  const inside = cx > x + 54 && cx < x + 122 && cy > y + 96 && cy < y + WH;
  if (inside && pet.last !== null) {
    const ddx = cx - pet.last;
    if (Math.abs(ddx) >= 3) {
      const sg = Math.sign(ddx), t = Date.now();
      if (pet.dir && sg !== pet.dir) { pet.flips = pet.flips.filter(f => t - f < 1200); pet.flips.push(t); }
      pet.dir = sg;

    if (pet.flips.length >= 2 && mode === "sleep") {
      if (Date.now() > nextFx) { heart(); nextFx = Date.now() + 450; }
    } else if (pet.flips.length >= 2) {

    }
  }
  if (!inside) { pet.flips = []; pet.dir = 0; }

  if (mode === "pet" || mode === "sleep") return;

  const dx = cx - (x + 88), dy = cy - (y + eyeY), dist = Math.hypot(dx, dy);
  if (dist < 240 && mood === "ronchon") {

    return;
  }
  if (dist < 240) {

    watching = true; idleUntil = Date.now() + 700;

    const turning = isSheet() && (faceSeq || !FRONT.has(img.src));
    const nd = dx < 0 ? -1 : 1; if (!turning && nd !== dir && Math.abs(dx) > 12) { dir = nd; face(); }

let watchT = setInterval(watchCursor, 60);
try {

    } else if (p.type === "leave") { if (mode === "ooh") toWalk(); }

      const paths = p.paths || [], name = (paths[0] || "").split("/").pop();

} catch (e) { say("drag-drop: " + e); }
function sendState() { T.event.emit("etat", {style, partsBy, thumb:FR.normal, mood, moodMode, moodReason}); }
function refreshSprite() {

function moodExtra() {
  if (mood === "guilleret") { pose("hop"); setTimeout(() => { if (mode === "walk") pose("walk"); }, 450); if (Math.random() < .4) bubble("Youpi !", 900); }
  else if (mood === "ronchon") bubble(Math.random() < .5 ? "Pff..." : "Mouais.", 1000);

function applyMood(m) {

}
// Humeur devinée d'après le rythme : l'app ne reçoit que les heures des prompts, jamais leur texte.
async function guessMood() {
  let times = [];

  const sessionH = lastT && now - lastT < 1200 ? (lastT - start) / 3600 : 0;
  if (h >= 20 || h < 7) return ["vaseux", "il est tard"];
  if (sessionH >= 3) return ["vaseux", `tu travailles depuis ${Math.floor(sessionH)} h sans vraie pause`];

async function autoMood() {

T.event.listen("style", async e => {

// Demi-tour : avec un perso dessiné, on joue son animation "turn" au lieu de retourner l'image.

function sparkle() {

  }

T.event.listen("evo", e => {
  if (SHEETS[style]) { bubble("Pas encore de parties", 1300); return; }
