[tools]
rust = "stable"
bun = "1.3.14"

# Du fichier Aseprite à l'app : réexporte les animations enregistrées et rassemble la feuille de la limace (voir tools/publier.py)
[tasks.publier]
description = "Réexporte les animations Aseprite enregistrées et met à jour la feuille de la limace"
dir = "{{config_root}}"
run = "python3 tools/publier.py"

# Temporaire : lance le Bidule de test
[tasks.bidule]
description = "Publie les animations, compile et lance le Bidule"
depends = ["publier"]
dir = "{{config_root}}/src-tauri"
run = "cargo build && ./target/debug/bidule-desktop"

# Version optimisée, plus fluide : à utiliser au quotidien
[tasks."bidule:release"]
description = "Publie les animations, compile en mode optimisé et lance le Bidule"
depends = ["publier"]
dir = "{{config_root}}/src-tauri"
run = "cargo build --release && ./target/release/bidule-desktop"

# Les tests du comportement, dans la page de test (Chromium sans fenêtre). Installe Playwright et son Chromium au premier lancement
[tasks.tests]
description = "Lance les tests du Bidule dans la page de test"
dir = "{{config_root}}"
run = "bun install --frozen-lockfile && bunx playwright install chromium && bun test --timeout 30000"

# Met en ligne le relais du duel sur Cloudflare (voir README, « Le relais du duel », pour la connexion au compte)
[tasks.relais]
description = "Met en ligne le relais du duel sur Cloudflare Workers"
dir = "{{config_root}}/relais"
tools = { node = "lts" }
run = "npx -y wrangler@4 deploy"
