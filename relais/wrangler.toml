# Le relais du duel sur Cloudflare Workers. Mise en ligne : mise run relais (voir README, « Le relais du duel »).
name = "duel"
main = "relais.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "DEFIS"
class_name = "Defi"

[[durable_objects.bindings]]
name = "ANNUAIRE"
class_name = "Annuaire"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Defi"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Annuaire"]
